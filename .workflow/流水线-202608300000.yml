name: 构建与提交
displayName: 自动构建并提交
triggers:
  push:
      branches:
            prefix:
                    - main
                    stages:
                      - name: 构建与提交
                          jobs:
                                - name: 执行脚本
                                        step: shell@agent
                                                inputs:
                                                          script: |
                                                                      chmod +x ./build.sh
                                                                                  ./build.sh
                                                                                              # 配置提交者信息（确保有权限推送）
                                                                                                          git config user.name "gitee_bot"
                                                                                                                      git config user.email "bot@gitee.com"
                                                                                                                                  # 提交并推送到当前触发分支
                                                                                                                                              git add .
                                                                                                                                                          git commit -m "ci: 自动提交编译产物 [skip ci]"
                                                                                                                                                                      git push origin HEAD:${GITEE_BRANCH}
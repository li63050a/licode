stages:
  - name: 构建与提交
      strategy: naturally # 串行执行
          jobs:
                - name: 执行脚本并提交
                        step: shell@agent # 使用 Shell 执行器[citation:2]
                                inputs:
                                          # 1. 进入代码根目录并执行编译脚本
                                                    script: |
                                                                chmod +x ./build.sh
                                                                            ./build.sh
                                                                                      # 2. 配置提交者信息并提交编译产物
                                                                                                  git config user.name "gitee_bot"
                                                                                                              git config user.email "bot@gitee.com"
                                                                                                                          git add .
                                                                                                                                      git commit -m "ci: 自动提交编译产物 [skip ci]"
                                                                                                                                                  git push origin HEAD:${GITEE_BRANCH}
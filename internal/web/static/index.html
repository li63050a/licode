<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4d6bfe">
<title>licode</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath d='M8 44 Q24 58 38 54 C52 50 74 48 90 46 Q104 44 110 54 Q114 62 108 70 Q98 78 82 76 C62 74 46 74 34 72 Q20 70 10 78 Q16 64 8 44 Z' fill='%234d6bfe'/%3E%3Cpath d='M98 42 Q96 34 88 30 Q96 34 102 32 Q96 38 98 42 Z' fill='%239db8ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:#4D6BFE; --primary-hover:#3A5AD9; --primary-light:rgba(77,107,254,.10);
    --primary-grad:linear-gradient(135deg,#6D8BFF,#4D6BFE);
    --bg:#F7F9FC; --bg-card:#FFFFFF; --bg-panel:#F7F9FC;
    --fg:#1A1F36; --text2:#5A6A85; --muted:#8892B0;
    --border:#E6EAF0;
    --green:#10b981; --red:#f0506e; --yellow:#f5a623; --purple:#8b5cf6;
    --shadow-sm:0 1px 3px rgba(0,0,0,.04);
    --shadow-md:0 4px 20px rgba(0,0,0,.06);
    --shadow-lg:0 12px 40px rgba(77,107,254,.12);
    --radius:14px;
  }
  html[data-theme="dark"] {
    --primary:#6D8BFF; --primary-light:rgba(109,139,255,.16);
    --primary-grad:linear-gradient(135deg,#7c98ff,#5a7bff);
    --bg:#0D111F; --bg-card:#161B2E; --bg-panel:#12182A;
    --fg:#EEF2FF; --text2:#9AA8C9; --muted:#6B7FA0;
    --border:#2A3050;
    --shadow-sm:0 1px 3px rgba(0,0,0,.2);
    --shadow-md:0 4px 20px rgba(0,0,0,.3);
    --shadow-lg:0 12px 40px rgba(0,0,0,.35);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); overflow:hidden;
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased; }
  #bgCanvas { position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; }

  /* 导航（毛玻璃） */
  header { position:relative; z-index:6; display:flex; align-items:center; gap:10px; padding:10px 18px;
    background:rgba(255,255,255,.75); border-bottom:1px solid rgba(77,107,254,.08);
    backdrop-filter:blur(16px) saturate(160%); -webkit-backdrop-filter:blur(16px) saturate(160%); }
  html[data-theme="dark"] header { background:rgba(13,17,31,.72); border-bottom-color:rgba(120,140,255,.10); }
  .logo { display:flex; align-items:center; gap:8px; font-weight:800; font-size:18px; color:var(--primary); letter-spacing:.2px; }
  .logo .whale { display:block; }
  .badge { color:var(--text2); font-size:12.5px; }
  #modelBadge { padding:4px 12px; border-radius:999px; background:var(--primary-light); color:var(--primary);
    font-weight:600; font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:34%; }
  .badge#meta { max-width:30%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spacer { flex:1; }
  .btn { border:1px solid var(--border); background:var(--bg-card); color:var(--fg); border-radius:12px;
    padding:6px 14px; font:inherit; font-size:12.5px; cursor:pointer; box-shadow:var(--shadow-sm);
    transition:transform .2s, box-shadow .2s, color .15s, border-color .15s; }
  .btn:hover { transform:translateY(-1px); box-shadow:var(--shadow-md); border-color:var(--primary); color:var(--primary); }
  .btn.primary { border-color:transparent; background:var(--primary-grad); color:#fff; border-radius:999px;
    box-shadow:0 4px 16px rgba(77,107,254,.30); font-weight:600; }
  .btn.primary:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(77,107,254,.35); color:#fff; }
  .icon-btn { border:none; background:none; color:var(--muted); cursor:pointer; padding:7px 9px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; transition:background .15s, color .15s; }
  .icon-btn:hover { background:var(--primary-light); color:var(--primary); }
  .icon-btn svg { display:block; }

  #layout { flex:1; display:flex; min-height:0; overflow:hidden; }

  /* 左侧会话栏 */
  #sidebar { width:230px; min-width:0; background:var(--bg-card); border-right:1px solid var(--border);
    display:flex; flex-direction:column; transition:width .22s ease, border-color .22s ease; overflow:hidden; }
  #sidebar.collapsed { width:0; border-right-color:transparent; }
  #sidebar .top { display:flex; align-items:center; padding:12px; gap:6px; }
  #sidebar .top .btn { flex:1; }
  #sideBody { flex:1; overflow-y:auto; min-height:0; padding:4px 0 10px; }
  #sideBody .group { padding:12px 16px 4px; font-size:11px; color:var(--muted); letter-spacing:.6px; text-transform:uppercase; }
  .sess { padding:8px 12px; cursor:pointer; display:flex; gap:6px; align-items:center; margin:2px 8px;
    border-radius:12px; font-size:13px; transition:background .15s, color .15s; }
  .sess:hover { background:var(--primary-light); }
  .sess.active { background:var(--primary-light); box-shadow:inset 2px 0 0 var(--primary); color:var(--primary); font-weight:600; }
  .sess .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sess .del { color:var(--muted); opacity:0; }
  .sess:hover .del { opacity:1; } .sess .del:hover { color:var(--red); }
  #sideFoot { padding:10px 14px; border-top:1px solid var(--border); font-size:11.5px; color:var(--muted); display:flex; gap:8px; align-items:center; }
  #sideFoot .btn { flex:1; }

  #main { flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }

  /* 状态岛 */
  #island { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:8;
    display:flex; align-items:center; gap:9px; padding:7px 16px; border-radius:999px;
    background:var(--bg-card); border:1px solid var(--border); box-shadow:var(--shadow-md);
    font-size:12.5px; font-weight:500; color:var(--fg); }
  #island .idot { width:8px; height:8px; border-radius:50%; background:var(--green); }
  #island .ibars { display:flex; gap:2px; align-items:flex-end; height:10px; }
  #island .ibars i { width:3px; border-radius:2px; background:var(--primary); }
  #islandText { color:var(--text2); }

  #chat { flex:1; overflow-y:auto; padding:22px; }
  .wrap { max-width:860px; margin:0 auto; }
  .empty { text-align:center; padding:13vh 0 2vh; }
  .empty .empty-logo { width:76px; height:76px; margin:0 auto 16px; border-radius:20px; background:var(--primary-grad);
    box-shadow:0 10px 30px rgba(77,107,254,.25); display:flex; align-items:center; justify-content:center; }
  .empty .title { font-size:30px; font-weight:800; letter-spacing:-.5px; color:var(--fg); }
  .empty .sub { color:var(--text2); margin-top:8px; font-size:14px; }
  .chips { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:28px; }
  .chips .chip { border:1px solid var(--border); background:var(--bg-card); border-radius:999px; padding:8px 18px;
    font-size:13px; cursor:pointer; color:var(--text2); box-shadow:var(--shadow-sm);
    transition:transform .2s, box-shadow .2s, color .15s, border-color .15s; }
  .chips .chip:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--primary); color:var(--primary); }

  .msg { margin-bottom:20px; }
  .msg .role { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .msg.user { display:flex; flex-direction:column; align-items:flex-end; }
  .msg.user .body { background:var(--primary-grad); color:#fff; border-radius:16px 16px 4px 16px; padding:10px 15px; max-width:78%; white-space:pre-wrap; }
  .msg.assistant .body { padding:2px 0; white-space:pre-wrap; word-break:break-word; }
  .msg.assistant .body p { margin:.6em 0; }
  .msg.assistant .body pre { background:var(--bg-panel); border:1px solid var(--border); border-radius:12px; padding:10px 12px; overflow-x:auto; font-size:12.5px; }
  .msg.assistant .body code { background:var(--primary-light); border-radius:4px; padding:1px 5px; font-size:12.5px; }
  .msg.assistant .body pre code { background:none; padding:0; }
  .msg.assistant .body a { color:var(--primary); }
  .msg.assistant .body table { border-collapse:collapse; } .msg.assistant .body td,th { border:1px solid var(--border); padding:4px 8px; }
  .msg.error .body { color:var(--red); }
  .cursor { display:inline-block; width:8px; height:15px; background:var(--primary); vertical-align:-2px; }
  .tool { margin:5px 0; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--bg-card); }
  .tool .head { display:flex; align-items:center; gap:8px; padding:6px 12px; cursor:pointer; font-size:12.5px; }
  .tool .name { color:var(--purple); font-weight:600; }
  .tool .status { color:var(--yellow); } .tool .status.done { color:var(--green); }
  .tool .chev { margin-left:auto; color:var(--muted); }
  .tool .detail { display:none; padding:8px 12px; border-top:1px solid var(--border); }
  .tool.open .detail { display:block; }
  .tool .detail pre { margin:0; white-space:pre-wrap; word-break:break-word; font-size:12px; color:var(--text2); }

  #askbar { display:none; padding:10px 16px; background:var(--bg-card); border-top:1px solid var(--border); text-align:center; }

  /* 输入区 */
  #composer { padding:12px 16px 16px; }
  .box { max-width:860px; margin:0 auto; }
  #composer .sel { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  #composer select { background:var(--bg-card); color:var(--fg); border:1px solid var(--border); border-radius:999px;
    padding:4px 12px; font:inherit; font-size:12px; outline:none; box-shadow:var(--shadow-sm); }
  .inputrow { display:flex; gap:8px; align-items:flex-end; border:1px solid var(--border); border-radius:16px;
    background:var(--bg-card); padding:6px 6px 6px 16px; box-shadow:var(--shadow-md); transition:border-color .15s, box-shadow .2s; }
  .inputrow:focus-within { border-color:var(--primary); box-shadow:0 4px 24px rgba(77,107,254,.14); }
  textarea#input { flex:1; resize:none; height:40px; max-height:170px; background:none; border:none; outline:none;
    color:var(--fg); font:inherit; padding:8px 0; }
  #send { border:none; background:var(--primary-grad); color:#fff; border-radius:999px; padding:9px 20px;
    font:inherit; font-weight:600; cursor:pointer; box-shadow:0 4px 16px rgba(77,107,254,.30); transition:transform .2s, box-shadow .2s, filter .15s; }
  #send:disabled { opacity:.5; cursor:default; }
  #send:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 24px rgba(77,107,254,.35); }
  .hint { margin-top:6px; color:var(--muted); font-size:11.5px; text-align:center; }

  /* 右侧栏 */
  #right { width:260px; min-width:0; background:var(--bg-card); border-left:1px solid var(--border);
    display:flex; flex-direction:column; transition:width .22s ease, border-color .22s ease; overflow:hidden; }
  #right.collapsed { width:0; border-left-color:transparent; }
  #right .tabs { display:flex; padding:10px 8px; gap:4px; }
  #right .tabs .tab { flex:1; text-align:center; padding:6px 0; border-radius:10px; font-size:12.5px; cursor:pointer; color:var(--muted); transition:background .15s, color .15s; }
  #right .tabs .tab.active { background:var(--primary-light); color:var(--primary); font-weight:600; }
  #rightBody { flex:1; overflow-y:auto; min-height:0; padding:10px; }
  .stat { background:var(--bg-panel); border:1px solid var(--border); border-radius:14px; padding:11px 13px; margin-bottom:9px; font-size:13px; }
  .stat .k { color:var(--muted); font-size:11.5px; } .stat .v { font-size:16px; font-weight:700; color:var(--fg); }
  .fnode { display:flex; align-items:center; gap:5px; padding:5px 8px; border-radius:9px; cursor:pointer; white-space:nowrap; font-size:12.5px; }
  .fnode:hover { background:var(--primary-light); } .fnode.sel { background:var(--primary-light); color:var(--primary); }
  .fnode.dir .ico { color:var(--primary); } .fnode .ico { color:var(--muted); width:14px; }
  .fnode .nm { overflow:hidden; text-overflow:ellipsis; }
  #fileEdit textarea { width:100%; min-height:180px; background:var(--bg-panel); color:var(--fg); border:1px solid var(--border);
    border-radius:12px; font:12.5px/1.6 ui-monospace,monospace; padding:10px; resize:none; }
  #fileEdit .bar { display:flex; gap:6px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  #fileEdit .path { flex:1; color:var(--muted); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* 弹窗 */
  .modal { display:none; position:fixed; inset:0; background:rgba(15,20,40,.4); z-index:10; align-items:center; justify-content:center; }
  .modal.on { display:flex; }
  .modal .panel { width:min(560px,94vw); max-height:88vh; overflow-y:auto; background:var(--bg-card); border:1px solid var(--border);
    border-radius:16px; padding:20px 24px; box-shadow:var(--shadow-lg); }
  .modal h3 { margin:0 0 14px; color:var(--primary); }
  .modal .row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .modal label { width:120px; color:var(--text2); font-size:12.5px; flex-shrink:0; }
  .modal input,.modal select,.modal textarea { flex:1; background:var(--bg-panel); color:var(--fg); border:1px solid var(--border);
    border-radius:10px; padding:7px 9px; font:inherit; font-size:13px; outline:none; }
  .modal textarea { font:12px/1.4 ui-monospace,monospace; resize:vertical; }
  .modal input:focus,.modal select:focus,.modal textarea:focus { border-color:var(--primary); }
  .modal .btns { display:flex; gap:10px; margin-top:16px; justify-content:flex-end; }
  .modal .about { line-height:1.9; } .modal .about a { color:var(--primary); text-decoration:none; }

  /* 未登录横幅 */
  .banner { display:none; align-items:center; gap:8px; padding:8px 16px; font-size:12.5px; background:#fff8e6; color:#7a5b00; border-bottom:1px solid #f0e0b8; }
  html[data-theme="dark"] .banner { background:#2a2410; color:#e6c96b; border-bottom-color:#3a3118; }
  .banner.show { display:flex; }
  .banner .txt { flex:1; }
  .banner button { border:none; background:none; font-size:14px; cursor:pointer; color:inherit; }

  /* 动画（默认关闭，设置可开启） */
  html[data-anim="on"] .msg { animation:fadeUp .3s ease; }
  html[data-anim="on"] .msg.user .body { animation:popIn .25s ease; }
  html[data-anim="on"] .tool { animation:slideIn .25s ease; }
  html[data-anim="on"] .cursor { animation:blink 1s steps(2) infinite; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  @keyframes popIn { from{opacity:0;transform:scale(.97)} to{opacity:1;transform:none} }
  @keyframes slideIn { from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:none} }
  @keyframes blink { 50%{opacity:0} }

  /* 移动端适配 */
  @media (max-width: 480px), (orientation: portrait) and (max-width: 768px) {
    .msg.user .body { max-width:100%; }
    #composer { padding:10px; }
    .wrap { max-width:100%; }
    #chat { padding:12px 10px; }
    .empty { padding:8vh 0 1vh; }
  }
  @media (orientation: landscape) and (max-height: 520px) { #chat { padding:12px; } }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="banner" id="authBanner">
  <span class="txt" id="authBannerText"></span>
  <button id="authBannerClose">✕</button>
</div>
<header>
  <button class="icon-btn" id="sideToggle" title="折叠/展开侧边栏">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <span class="logo" id="brandLogo"></span>
  <span class="badge" id="modelBadge"></span>
  <span class="spacer"></span>
  <span class="badge" id="meta"></span>
  <button class="icon-btn" id="themeToggle" title="切换主题"></button>
  <button class="icon-btn" id="rightToggle" title="信息/文件">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
  </button>
</header>

<div id="layout">
  <aside id="sidebar">
    <div class="top">
      <button class="btn primary" id="newSession">+ 新对话</button>
    </div>
    <div id="sideBody">
      <div class="group" data-i18n="g_sessions">对话</div>
      <div id="sessionList"></div>
      <div class="group" data-i18n="g_system">系统</div>
      <div class="sess" id="btnSettings"><span class="t" data-i18n="settings_btn">设置</span></div>
      <div class="sess" id="btnAbout"><span class="t" data-i18n="about_btn">关于</span></div>
    </div>
    <div id="sideFoot">
      <span id="ver"></span>
    </div>
  </aside>

  <main id="main">
    <div id="island">
      <span class="idot"></span>
      <span class="ibars"><i></i><i></i><i></i></span>
      <span id="islandText"></span>
    </div>
    <div id="chat"><div class="wrap" id="chatInner"></div></div>

    <div id="askbar">
      <span data-i18n="ask_prefix">是否允许执行工具</span> <b id="askTool"></b>？
      <button class="btn" id="askNo" data-i18n="ask_no">拒绝</button>
      <button class="btn" id="askYes" data-i18n="ask_yes">允许</button>
      <button class="btn primary" id="askAlways" data-i18n="ask_always">始终允许</button>
    </div>

    <div id="composer">
      <div class="box">
        <div class="sel">
          <select id="selProvider">
            <option>openai</option><option>claude</option><option>ollama</option><option>gemini</option>
          </select>
          <select id="selThink">
            <option value="0" data-i18n="think_off">思考：关闭</option>
            <option value="0.3" data-i18n="think_low">思考：低</option>
            <option value="0.7" data-i18n="think_mid">思考：中</option>
            <option value="1.0" data-i18n="think_high">思考：高</option>
            <option value="1.5" data-i18n="think_max">思考：max</option>
          </select>
          <span class="spacer"></span>
        </div>
        <div class="inputrow">
          <textarea id="input" data-i18n-placeholder="input_ph" rows="1"></textarea>
          <button id="send" disabled data-i18n="send">发送</button>
        </div>
        <div class="hint" data-i18n="hint"></div>
      </div>
    </div>
  </main>

  <aside id="right">
    <div class="tabs">
      <div class="tab active" id="tabInfo" data-i18n="tab_info">信息</div>
      <div class="tab" id="tabFiles" data-i18n="tab_files">文件</div>
    </div>
    <div id="rightBody">
      <div id="infoPanel">
        <div class="stat"><div class="k" data-i18n="st_messages">消息数</div><div class="v" id="stMessages">0</div></div>
        <div class="stat"><div class="k" data-i18n="st_tokens">上下文 tokens（估算）</div><div class="v" id="stTokens">0</div></div>
        <div class="stat"><div class="k" data-i18n="st_model">模型</div><div class="v" id="stModel">-</div></div>
        <div class="stat"><div class="k" data-i18n="st_workspace">工作目录</div><div class="v" id="stWorkspace">-</div></div>
      </div>
      <div id="filePanel" style="display:none">
        <div id="fileTree"></div>
        <div id="fileEdit">
          <div class="bar">
            <span class="path" id="filePath"></span>
            <button class="btn" id="fileSetWs" data-i18n="set_workspace">设为工作目录</button>
            <button class="btn primary" id="fileSave" data-i18n="save">保存</button>
          </div>
          <textarea id="fileContent" placeholder="…"></textarea>
        </div>
      </div>
    </div>
  </aside>
</div>

<div class="modal" id="settings">
  <div class="panel">
    <h3 data-i18n="settings_title">设置</h3>
    <div class="row"><label data-i18n="l_provider">提供商</label>
      <input id="st_provider" list="providerList">
      <datalist id="providerList"></datalist></div>
    <div class="row"><label data-i18n="l_model">模型</label>
      <input id="st_model" list="modelList">
      <button class="btn" id="btnModels" data-i18n="fetch_models">获取模型</button></div>
    <datalist id="modelList"></datalist>
    <div class="row"><label data-i18n="l_base">API 地址</label><input id="st_base_url"></div>
    <div class="row"><label data-i18n="l_key">API 密钥</label><input id="st_api_key" type="password"></div>
    <div class="row"><label data-i18n="l_providers">厂商列表</label><textarea id="st_providers" rows="4" placeholder='[{"provider":"openai","name":"OpenAI","type":"openai","base_url":"https://api.openai.com/v1","api_key":"","model":"gpt-4o"}]'></textarea></div>
    <div class="row"><label data-i18n="l_newprov">新增厂商</label></div>

/* ---------- Markdown ---------- */
function md(s) {
  s = esc(s);
  const blocks = [];
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (m, l, c) => { blocks.push('<pre><code class="lang-' + (l||'') + '">' + c.replace(/\n+$/,'') + '</code></pre>'); return '\u0000' + (blocks.length-1) + '\u0000'; });
  s = s.replace(/^#### (.*)$/gm, '<h4>$1</h4>')
       .replace(/^### (.*)$/gm, '<h3>$1</h3>')
       .replace(/^## (.*)$/gm, '<h2>$1</h2>')
       .replace(/^# (.*)$/gm, '<h1>$1</h1>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
       .replace(/\*([^*]+)\*/g, '<i>$1</i>')
       .replace(/`([^`]+)`/g, '<code>$1</code>')
       .replace(/~~([^~]+)~~/g, '<s>$1</s>')
       .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(\|[^\n]+\|\n\|[\s:-|]+\|\n(?:[^\n]+\|\n?)+)/g, (m) => {
    const rows = m.trim().split('\n').filter(r => r.trim());
    if (rows.length < 2) return m;
    const parse = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
    let html = '<table><thead><tr>';
    parse(rows[0]).forEach(c => html += '<th>' + c + '</th>');
    html += '</tr></thead><tbody>';
    for (let i = 2; i < rows.length; i++) {
      html += '<tr>';
      parse(rows[i]).forEach(c => html += '<td>' + c + '</td>');
      html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
  });
  s = s.replace(/^(>.*(?:\n>.*)*)$/gm, (m) => '<blockquote>' + m.replace(/^>\s?/gm, '').replace(/\n/g, '<br>') + '</blockquote>');
  const listItems = [];
  s = s.replace(/^(\s*)[-*+]\s+(.*)$/gm, (m, ind, t) => { listItems.push('<li>' + t + '</li>'); return '\u0001li\u0001'; });
  s = s.replace(/^(\s*)\d+\.\s+(.*)$/gm, (m, ind, t) => { listItems.push('<li>' + t + '</li>'); return '\u0001ol\u0001'; });
  s = s.replace(/((?:\u0001li\u0001)+)/g, '<ul>$1</ul>');
  s = s.replace(/((?:\u0001ol\u0001)+)/g, '<ol>$1</ol>');
  listItems.length = 0;
  s = s.split(/\n{2,}/).map(p => {
    p = p.trim();
    if (!p) return '';
    if (/^<(h\d|ul|ol|blockquote|pre|table|p)/.test(p)) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[+i]);
  return s;
}

/* ---------- 文件 ---------- */
let wsRoot = '';
async function api(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
  return data;
}
async function loadFiles(path) {
  try {
    const data = await api('/api/files?path=' + encodeURIComponent(path || ''));
    wsRoot = data.root;
    renderTree(data.entries, path || '');
  } catch (e) { $('fileTree').innerHTML = '<div class="badge">' + esc(e.message) + '</div>'; }
}
function renderTree(entries, base) {
  const tree = $('fileTree'); tree.innerHTML = '';
  if (base) {
    const up = el('div', 'fnode dir'); up.appendChild(el('span', 'ico', '↑')); up.appendChild(el('span', 'nm', '..'));
    up.addEventListener('click', () => loadFiles(base.split('/').slice(0, -1).join('/')));
    tree.appendChild(up);
  }
  for (const e of entries) {
    const n = el('div', 'fnode' + (e.isDir ? ' dir' : ''));
    n.appendChild(el('span', 'ico', e.isDir ? '▸' : '📄'));
    n.appendChild(el('span', 'nm', e.name));
    n.addEventListener('click', () => {
      tree.querySelectorAll('.fnode').forEach(x => x.classList.remove('sel'));
      n.classList.add('sel');
      if (e.isDir) loadFiles(e.path); else openFile(e.path);
    });
    tree.appendChild(n);
  }
}
async function openFile(path) {
  try {
    const data = await api('/api/file?path=' + encodeURIComponent(path));
    $('filePath').textContent = data.path;
    $('fileContent').value = data.content;
    $('fileContent').dataset.path = path;
  } catch (e) { $('filePath').textContent = e.message; }
}
$('fileSave').addEventListener('click', async () => {
  const path = $('fileContent').dataset.path;
  if (!path) return;
  try { await api('/api/file', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ path, content:$('fileContent').value }) }); $('filePath').textContent = '✓ ' + path; }
  catch (e) { alert(e.message); }
});
$('fileSetWs').addEventListener('click', async () => {
  const path = $('fileContent').dataset.path;
  const dir = path ? path.split('/').slice(0, -1).join('/') : wsRoot;
  try { const d = await api('/api/workspace', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ path:dir }) }); $('st_workspace').value = d.root; $('stWorkspace').textContent = d.root; }

function readSettings() {
  let mcp = []; try { mcp = JSON.parse($('st_mcp').value || '[]'); } catch (e) {}
  let providers = []; try { providers = JSON.parse($('st_providers').value || '[]'); } catch (e) {}
  const rules = {};
  $('st_rules').value.split(/[,，]/).forEach(p => { const [k, v] = p.split(':').map(x => x.trim()); if (k && v) rules[k] = v; });
  return {
    provider: $('st_provider').value, model: $('st_model').value, base_url: $('st_base_url').value, api_key: $('st_api_key').value,
    temperature: parseFloat($('st_temperature').value) || 0.7, max_tokens: parseInt($('st_max_tokens').value) || 4096,
    max_iterations: parseInt($('st_max_iterations').value) || 16,
    subagents: $('st_subagents').value === t('on'), compaction: $('st_compaction').value === t('on'), title_gen: $('st_titlegen').value === t('on'),
    auto_allow: $('st_auto').value === t('on'),
    tool_rules: rules, mcp_servers: mcp,
    providers: providers,
  };
}
function populateProviders() {
  const sel = $('selProvider');
  const cur = sel.value;
  sel.innerHTML = '';
  const dl = $('providerList'); dl.innerHTML = '';
  let list = [];
  if (curSettings.providers && curSettings.providers.length) {
    curSettings.providers.forEach(p => { if (p.provider) list.push({ provider: p.provider, label: (p.name || p.provider) + (p.model ? '/' + p.model : '') }); });
  }
  if (!list.length) ['openai','claude','google'].forEach(p => list.push({ provider: p, label: p }));
  list.forEach(it => {
    const o = document.createElement('option'); o.value = it.label; o.textContent = it.label; sel.appendChild(o);
    const d = document.createElement('option'); d.value = it.provider; d.textContent = it.provider; dl.appendChild(d);
  });
  if (cur) { [...sel.options].some(o => o.value === cur) && (sel.value = cur); }
}

/* ---------- 主题切换 ---------- */
const MOON_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
const SUN_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';

/* ---------- 背景：粒子 + 鲸鱼 ---------- */
const bgc = $('bgCanvas'), bctx = bgc.getContext('2d');
let BW = 0, BH = 0, parts = [], whales = [], bgRaf = 0, lastSpawn = 0;
function bgAccent() { return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#4d6bfe'; }
function bgResize() { BW = bgc.width = window.innerWidth; BH = bgc.height = window.innerHeight; }
function bgRand(a, b) { return a + Math.random() * (b - a); }
function initParts() {
  parts = [];
  const n = Math.max(22, Math.min(80, Math.floor(BW * BH / 24000)));
  for (let i = 0; i < n; i++) parts.push({ x: bgRand(0, BW), y: bgRand(0, BH), r: bgRand(1, 3.2), v: bgRand(0.1, 0.4), a: bgRand(0.06, 0.35), tw: bgRand(0.002, 0.012), ph: bgRand(0, Math.PI * 2) });
}
function whalePath(c) {
  c.moveTo(-52, -18);
  c.quadraticCurveTo(-36, -4, -22, -8);
  c.bezierCurveTo(-8, -12, 14, -14, 30, -16);
  c.quadraticCurveTo(44, -18, 50, -8);
  c.quadraticCurveTo(54, 0, 48, 8);
  c.quadraticCurveTo(38, 16, 22, 14);
  c.bezierCurveTo(2, 12, -14, 12, -26, 10);
  c.quadraticCurveTo(-40, 8, -50, 16);
  c.quadraticCurveTo(-44, 2, -52, -18);
  c.closePath();
  c.moveTo(38, -20);
  c.quadraticCurveTo(36, -28, 28, -32);
  c.quadraticCurveTo(36, -28, 42, -30);
  c.quadraticCurveTo(36, -24, 38, -20);
  c.closePath();
}
function spawnWhale() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  whales.push({ x: dir > 0 ? -170 : BW + 170, y: bgRand(BH * 0.18, BH * 0.66), s: bgRand(0.55, 1.15), v: dir * bgRand(0.35, 0.75), a: bgRand(0.05, 0.14), delay: bgRand(0, 50) });
}
function bgTick() {
  bctx.clearRect(0, 0, BW, BH);
  const acc = bgAccent();
  for (const p of parts) {
    p.y -= p.v; p.ph += p.tw;
    if (p.y < -8) { p.y = BH + 8; p.x = bgRand(0, BW); }
    const al = p.a * (0.6 + 0.4 * Math.sin(p.ph));
    bctx.beginPath(); bctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    bctx.fillStyle = acc; bctx.globalAlpha = al; bctx.fill();
  }
  for (let i = whales.length - 1; i >= 0; i--) {
    const w = whales[i];
    if (w.delay > 0) { w.delay--; continue; }
    w.x += w.v;
    if ((w.v > 0 && w.x > BW + 190) || (w.v < 0 && w.x < -190)) { whales.splice(i, 1); continue; }
    bctx.save();
    bctx.translate(w.x, w.y);
    bctx.scale(w.v > 0 ? w.s : -w.s, w.s);
    bctx.globalAlpha = w.a;
    bctx.fillStyle = acc;
    bctx.beginPath();
    whalePath(bctx);
    bctx.fill();
    bctx.restore();
  }
  bctx.globalAlpha = 1;
  bgRaf = requestAnimationFrame(bgTick);
}
function startBg() {
  if (!anim) return;
  if (!BW) { bgResize(); initParts(); }
  if (bgRaf) return;
  bgRaf = requestAnimationFrame(bgTick);
}
function stopBg() { if (bgRaf) cancelAnimationFrame(bgRaf); bgRaf = 0; bctx.clearRect(0, 0, BW, BH); }
setInterval(() => { if (anim && whales.length < 2) spawnWhale(); }, 9000);
window.addEventListener('resize', () => { bgResize(); initParts(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) stopBg(); else startBg(); });

/* ---------- 连接 ---------- */
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');
  ws.onopen = () => { ws.send(JSON.stringify({ type:'sessions_get' })); ws.send(JSON.stringify({ type:'settings_get' })); setConn(true); };
  ws.onclose = () => { setConn(false); setTimeout(connect, 2000); };
  ws.onmessage = e => {
    let evt; try { evt = JSON.parse(e.data); } catch { return; }
    switch (evt.type) {
      case 'delta': {
        if (busy && !lastAssistant) lastAssistant = addMsg('assistant', '');
        if (lastAssistant) appendTo(lastAssistant, evt.content);
        if (busy && !$('island').classList.contains('think')) setIsland('think', t('thinking'));
        break;
      }
      case 'tool_start': tools.push(addTool(evt)); break;
      case 'tool_done': if (tools.length) setToolDone(tools.pop(), evt); break;
      case 'status': { const s = evt.content || ''; $('meta').textContent = s; if (busy) setIsland('think', s || t('thinking')); break; }
      case 'settings': if ($('settings').classList.contains('on')) fillSettings(evt.settings || {}); else { curSettings = evt.settings || {}; setConn(true); } break;
      case 'sessions': sessions = evt.sessions || []; curSession = evt.sessionId || ''; renderSessions(); break;
      case 'stats':
        $('stMessages').textContent = (evt.stats && evt.stats.messages) || 0;
        $('stTokens').textContent = (evt.stats && evt.stats.tokens) || 0;
        break;
      case 'ask': showAsk(evt); break;
      case 'done':
        busy = false; lastAssistant = null; tools = []; $('meta').textContent = '';
        setIsland('ok', t('conn_ok'));
        ws.send(JSON.stringify({ type:'sessions_get' }));
        sendBtn.disabled = !(ws && ws.readyState === WebSocket.OPEN);
        break;
      case 'error':
        addMsg('assistant', '⚠ ' + evt.error, true); busy = false; lastAssistant = null;
        setIsland('ok', t('conn_ok'));
        sendBtn.disabled = !(ws && ws.readyState === WebSocket.OPEN);
        break;
    }
  };
}

/* ---------- 发送 ---------- */
function send() {
  const text = input.value.trim();
  if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
  if (text === '/clear') { chatInner.innerHTML = ''; renderEmpty(); ws.send(JSON.stringify({ type:'message', content:'/clear' })); input.value = ''; return; }
  addMsg('user', text); input.value = ''; busy = true; sendBtn.disabled = true;
  ws.send(JSON.stringify({ type:'message', content:text }));
}
function renderEmpty() {
  chatInner.innerHTML = '';
  const e = el('div', 'empty');
  const lw = el('div', 'empty-logo'); lw.innerHTML = whaleSVG(52);
  e.appendChild(lw);
  e.appendChild(el('div', 'title', 'licode'));
  e.appendChild(el('div', 'sub', t('hint')));
  const chips = el('div', 'chips');
  const list = [t('think_max'), '帮我写一段 Go 代码', '解释这段代码', '找到并修复这个 bug'];
  list.forEach(s => { const c = el('button', 'chip', s); c.addEventListener('click', () => { input.value = s; input.focus(); }); chips.appendChild(c); });
  e.appendChild(chips);
  chatInner.appendChild(e);
}
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
sendBtn.addEventListener('click', send);

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>licode</title>
<style>
:root {
  --primary:#4D6BFE; --primary-hover:#3D5BF0; --primary-light:rgba(77,107,254,.08);
  --bg:#F7F8FA; --bg-card:#FFF; --bg-panel:#F2F3F5;
  --fg:#1F2329; --fg2:#4E5969; --muted:#86909C;
  --border:#E5E6EB; --green:#2E7D32; --red:#C62828; --yellow:#C77700;
  --shadow:0 2px 8px rgba(0,0,0,.06); --radius:10px;
  --mono:'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
}
[data-theme="dark"] {
  --primary:#5B7BFF; --primary-light:rgba(91,123,255,.16);
  --bg:#17181A; --bg-card:#1F2023; --bg-panel:#141517;
  --fg:#F2F3F5; --fg2:#C9CDD4; --muted:#86909C;
  --border:#2E3033; --green:#5EC279; --red:#F0656A; --yellow:#F0B429;
  --shadow:0 2px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--sans)}

/* layout */
.app{display:flex;height:100vh}
.sidebar{width:240px;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar.collapsed{width:0;border:none;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.right{width:300px;background:var(--bg-card);border-left:1px solid var(--border);flex-shrink:0;overflow-y:auto}
.right.collapsed{width:0;border:none;overflow:hidden}

/* header */
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg-card);flex-shrink:0}
header .logo{font-weight:700;font-size:16px;color:var(--primary);display:flex;align-items:center;gap:6px}
header .spacer{flex:1}
.ib{border:none;background:none;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:8px;display:flex;align-items:center}
.ib:hover{background:var(--primary-light);color:var(--primary)}

/* sidebar */
.sidebar .top{padding:12px;display:flex;gap:6px}
.sidebar .top button{flex:1}
.slist{flex:1;overflow-y:auto;padding:4px 8px}
.sitem{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.sitem:hover{background:var(--primary-light)}
.sitem.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.sitem .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .x{opacity:0;color:var(--muted);font-size:12px}
.sitem:hover .x{opacity:1}
.sidebar .foot{padding:10px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

/* buttons */
.btn{border:1px solid var(--border);background:var(--bg-card);color:var(--fg);border-radius:8px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.p{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.p:hover{background:var(--primary-hover)}

/* chat */
#chat{flex:1;overflow-y:auto;padding:24px 16px}
.wrap{max-width:800px;margin:0 auto}
.empty{text-align:center;padding:20vh 0 4vh;color:var(--muted)}
.empty .title{font-size:28px;font-weight:700;color:var(--fg);margin-bottom:8px}
.msg{margin-bottom:16px;display:flex;gap:10px}
.msg .avatar{width:30px;height:30px;border-radius:8px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.msg.user .avatar{background:#E8F5E9;color:var(--green)}
.msg .body{flex:1;min-width:0}
.msg .content{line-height:1.7}
.msg.user .content{background:var(--bg-panel);padding:10px 14px;border-radius:10px;display:inline-block;max-width:85%}
.msg .meta{font-size:11px;color:var(--muted);margin-top:4px}

/* markdown */
.msg .content p{margin:6px 0}
.msg .content pre{background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:8px 0;position:relative}
.msg .content code{font-family:var(--mono);font-size:13px}
.msg .content :not(pre)>code{background:var(--bg-panel);padding:2px 6px;border-radius:4px}
.msg .content ul,.msg .content ol{padding-left:20px;margin:6px 0}
.msg .content blockquote{border-left:3px solid var(--primary);padding-left:12px;color:var(--fg2);margin:8px 0}
.msg .content table{border-collapse:collapse;margin:8px 0;width:100%}
.msg .content th,.msg .content td{border:1px solid var(--border);padding:6px 10px;text-align:left;font-size:13px}
.msg .content th{background:var(--bg-panel)}

/* tool call */
.tool{margin:8px 0;border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:13px}
.tool .head{padding:8px 12px;background:var(--bg-panel);cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:500}
.tool .head .name{color:var(--primary)}
.tool .head .status{margin-left:auto;font-size:11px;color:var(--muted)}
.tool .body{padding:0 12px;max-height:0;overflow:hidden;transition:max-height .2s}
.tool.open .body{max-height:400px;overflow-y:auto;padding:8px 12px}
.tool pre{margin:0;background:var(--bg-panel);border:none;border-radius:0;padding:8px;font-size:12px}

/* copy btn on pre */
pre .cp{position:absolute;top:6px;right:6px;background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;color:var(--muted)}
pre .cp:hover{color:var(--primary)}

/* input */
#inputBar{padding:12px 16px;border-top:1px solid var(--border);background:var(--bg-card)}
#inputBar .wrap{max-width:800px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
#input{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;resize:none;outline:none;min-height:42px;max-height:180px;line-height:1.5;font-family:var(--sans)}
#input:focus{border-color:var(--primary)}
#send{width:40px;height:40px;border-radius:10px;border:none;background:var(--primary);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#send:disabled{opacity:.4;cursor:not-allowed}

/* ask bar */
#askBar{display:none;padding:10px 16px;border-top:1px solid var(--border);background:var(--bg-card)}
#askBar .wrap{max-width:800px;margin:0 auto;display:flex;align-items:center;gap:8px}
#askBar .info{flex:1;font-size:13px}
#askBar .info b{color:var(--primary)}

/* status */
.status{padding:6px 16px;font-size:11px;color:var(--muted);text-align:center;border-top:1px solid var(--border);background:var(--bg-card)}

/* settings modal */
.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4);align-items:center;justify-content:center}
.modal.on{display:flex}
.modal .box{background:var(--bg-card);border-radius:14px;width:560px;max-width:94vw;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal .box .hd{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.modal .box .bd{padding:16px 20px}
.modal .box .ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;color:var(--fg2);margin-bottom:4px;font-weight:500}
.fg input,.fg select,.fg textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;background:var(--bg);color:var(--fg);outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--primary)}
.fg textarea{min-height:60px;resize:vertical;font-family:var(--mono);font-size:12px}

/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200}
#toast .t{background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;margin-top:6px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* right panel tabs */
.rtabs{display:flex;border-bottom:1px solid var(--border)}
.rtabs button{flex:1;padding:10px;border:none;background:none;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.rtabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.rpanel{padding:12px}
.rpanel h4{font-size:12px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.rpanel .row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
.rpanel .row:last-child{border:none}

/* mobile */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;box-shadow:var(--shadow);transform:translateX(-100%);transition:.2s}
  .sidebar.show{transform:none}
  .right{position:fixed;right:0;top:0;bottom:0;z-index:50;box-shadow:var(--shadow);transform:translateX(100%);transition:.2s}
  .right.show{transform:none}
  #chat{padding:16px 12px}
}
</style>
</head>
<body>
<div class="app">
  <!-- sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="top">
      <button class="btn p" onclick="newSession()">+ 新对话</button>
    </div>
    <div class="slist" id="slist"></div>
    <div class="foot">
      <div id="connStat" style="display:flex;align-items:center;gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block"></span> 已连接</div>
    </div>
  </div>

  <!-- main -->
  <div class="main">
    <header>
      <button class="ib" onclick="toggle('sidebar')" title="侧边栏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="logo">licode</div>
      <span id="modelTag" style="font-size:11px;color:var(--muted)"></span>
      <div class="spacer"></div>
      <button class="ib" onclick="openSettings()" title="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
      </button>
      <button class="ib" onclick="toggle('right')" title="信息">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      </button>
      <button class="ib" id="themeBtn" onclick="toggleTheme()" title="主题">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </header>

    <div id="chat"><div class="wrap" id="chatWrap"><div class="empty"><div class="title">licode</div><div>有什么可以帮你的？</div></div></div></div>

    <!-- ask bar -->
    <div id="askBar">
      <div class="wrap">
        <div class="info">工具 <b id="askName"></b> 请求执行</div>
        <button class="btn" onclick="replyAsk(false)">拒绝</button>
        <button class="btn p" onclick="replyAsk(true)">允许</button>
        <button class="btn" onclick="replyAsk(true,true)" style="font-size:12px">始终允许</button>

    <!-- input -->
    <div id="inputBar">

        <textarea id="input" rows="1" placeholder="输入消息..."></textarea>
        <button id="send" onclick="send()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
      </div>
    </div>
    <div class="status" id="statusBar"></div>
  </div>

  <!-- right panel -->
  <div class="right collapsed" id="right">
    <div class="rtabs">

      <button onclick="switchTab('files',this)">文件</button>
    </div>
    <div class="rpanel" id="tabInfo">

      <div class="row"><span>消息数</span><span id="sMsgs">0</span></div>
      <div class="row"><span>Token 估算</span><span id="sTokens">0</span></div>

      <h4>联系与交流</h4>
      <div class="row"><span>GitHub</span><a href="https://github.com/li63050a/licode" target="_blank" style="color:var(--primary);text-decoration:none">li63050a/licode</a></div>
      <div class="row"><span>Gitee</span><a href="https://gitee.com/li63050a/licode" target="_blank" style="color:var(--primary);text-decoration:none">li63050a/licode</a></div>
      <div class="row"><span>B 站</span><a href="https://b23.tv/nDqj0DT" target="_blank" style="color:var(--primary);text-decoration:none">小帅5656</a></div>
      <div class="row"><span>QQ 群</span><a href="https://qun.qq.com/universal-share/share?ac=1&authKey=zq9BYcTtBQm6GbvWiEWiBvDWNWbqhw2%2F%2BRnGM21c0jcL%2FofGqBFeXLr%2BtYT3SkO6&busi_data=eyJncm91cENvZGUiOiIxMDI2OTM5NzQxIiwidG9rZW4iOiJxNkNWUTUxYXVxSmRHZXRvdWtkZnhaN25INzJrMmNaNFpVTjJ5ZTVLYmRvWTFuOEZTd093UXBtQi8vQWk2T1JyIiwidWluIjoiMzYzNTczNjE4MCJ9&data=073ZrPEFZXFvoEDWatbWTidAitiN4OIbiaVDWoR7hVIwJurEPC7Swm6OREVpn6omzobXLn3SRErNKxKbYDTZQA&svctype=4&tempid=h5_group_info" target="_blank" style="color:var(--primary);text-decoration:none">1026939741</a></div>
    </div>
    <div class="rpanel" id="tabFiles" style="display:none;padding:0">
      <div style="padding:12px 12px 8px">
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <input id="fPath" style="flex:1" placeholder="路径" />

        <div id="fTree" style="font-size:13px"></div>

      <!-- code editor -->
      <div id="editorWrap" style="display:none;border-top:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg-panel)">
          <span id="editorFile" style="flex:1;font-size:12px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg2)"></span>
          <button class="btn" style="padding:4px 10px;font-size:11px" onclick="saveFile()">保存</button>
          <button class="ib" style="padding:4px" onclick="closeEditor()">✕</button>
        </div>
        <div style="display:flex;overflow:hidden;max-height:50vh">
          <div id="lineNums" style="padding:8px 0;text-align:right;color:var(--muted);font:12px/1.5 var(--mono);min-width:36px;user-select:none;overflow:hidden;background:var(--bg-panel);border-right:1px solid var(--border)"></div>
          <textarea id="editor" style="flex:1;padding:8px 12px;border:none;outline:none;resize:none;font:12px/1.5 var(--mono);background:var(--bg-card);color:var(--fg);tab-size:2;overflow:auto;min-height:200px"></textarea>
        </div>

</div>

<!-- settings modal -->
<div class="modal" id="settingsModal">
  <div class="box">
    <div class="hd">设置 <button class="ib" onclick="closeSettings()">✕</button></div>
    <div class="bd">
      <div class="fg"><label>提供商</label><select id="sProv"></select></div>
      <div class="fg"><label>模型</label><input id="sModel" /></div>
      <div class="fg"><label>API Key</label><input id="sKey" type="password" /></div>
      <div class="fg"><label>Base URL</label><input id="sBase" /></div>
      <div class="fg"><label>Temperature</label><input id="sTemp" type="number" step="0.1" min="0" max="2" /></div>
      <div class="fg"><label>Max Tokens</label><input id="sMaxTok" type="number" /></div>
      <div class="fg"><label>Max 迭代次数</label><input id="sMaxIter" type="number" /></div>
      <div class="fg"><label>子代理</label><select id="sSub"><option value="on">开启</option><option value="off">关闭</option></select></div>
      <div class="fg"><label>自动允许工具</label><select id="sAuto"><option value="on">开启</option><option value="off">关闭</option></select></div>
      <div class="fg"><label>MCP 服务器 (JSON)</label><textarea id="sMCP"></textarea></div>
      <div class="fg"><label>多提供商 (JSON)</label><textarea id="sProvs"></textarea></div>
    </div>
    <div class="ft">
      <button class="btn" onclick="closeSettings()">取消</button>
      <button class="btn p" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* helpers */
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};

/* state */
let ws,busy=false,lastAsst=null,tools=[],curAsk=null,sessions=[],curSess='',prevSess='';
let curSettings={};

/* theme */
let theme=localStorage.getItem('licode_theme')||'light';
function applyTheme(){document.documentElement.setAttribute('data-theme',theme);$('themeIcon').innerHTML=theme==='dark'?'<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>':'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';}
function toggleTheme(){theme=theme==='dark'?'light':'dark';localStorage.setItem('licode_theme',theme);applyTheme();}
applyTheme();

/* toggle sidebar/right */
function toggle(id){$(id).classList.toggle('collapsed');}

/* sessions */
function renderSessions(){
  const list=$('slist');list.innerHTML='';
  for(const s of sessions){
    const d=document.createElement('div');
    d.className='sitem'+(s.id===curSess?' active':'');
    d.innerHTML='<span class="t">'+esc(s.title||'新对话')+'</span><span class="x" data-id="'+s.id+'">✕</span>';
    d.querySelector('.t').onclick=()=>{if(s.id!==curSess)ws.send(JSON.stringify({type:'session_switch',sessionId:s.id}));};
    d.querySelector('.x').onclick=e=>{e.stopPropagation();ws.send(JSON.stringify({type:'session_delete',sessionId:s.id}));};
    list.appendChild(d);
  }
}
function newSession(){ws.send(JSON.stringify({type:'session_new'}));}

/* chat */
function renderEmpty(){$('chatWrap').innerHTML='<div class="empty"><div class="title">licode</div><div>有什么可以帮你的？</div></div>';}
function addMsg(role,text){
  const last=$('chatWrap').querySelector('.empty');if(last)last.remove();
  const d=document.createElement('div');d.className='msg '+role;
  const av=role==='user'?'你':'AI';
  d.innerHTML='<div class="avatar">'+av+'</div><div class="body"><div class="content"></div></div>';
  d.querySelector('.content').innerHTML=renderMd(text);
  $('chatWrap').appendChild(d);scrollBottom();
  return d.querySelector('.content');
}
function appendTo(el,chunk){
  if(!el)return;
  el.innerHTML=renderMd(el.dataset.full=(el.dataset.full||'')+chunk);
  scrollBottom();
}
function scrollBottom(){$('chat').scrollTop=$('chat').scrollTop+999;}

/* markdown (lightweight) */
function renderMd(s){
  if(!s)return'';
  s=esc(s);
  // code blocks
  s=s.replace(/```(\w*)\n([\s\S]*?)```/g,(_,lang,code)=>'<pre><code class="lang-'+lang+'">'+code+'</code><button class="cp" onclick="copyPre(this)">复制</button></pre>');
  // inline code
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  // bold
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  // italic
  s=s.replace(/\*(.+?)\*/g,'<i>$1</i>');
  // headers
  s=s.replace(/^### (.+)$/gm,'<h4>$1</h4>');
  s=s.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  s=s.replace(/^# (.+)$/gm,'<h2>$1</h2>');
  // lists
  s=s.replace(/^- (.+)$/gm,'<li>$1</li>');
  s=s.replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>');
  // links
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  // newlines
  s=s.replace(/\n/g,'<br>');
  return s;
}
function copyPre(btn){const code=btn.previousElementSibling;navigator.clipboard.writeText(code.textContent).then(()=>{btn.textContent='已复制';setTimeout(()=>btn.textContent='复制',1500);});}

/* tool call */
function addTool(evt){
  const d=document.createElement('div');d.className='tool';
  d.innerHTML='<div class="head" onclick="this.parentElement.classList.toggle(\'open\')"><span class="name">⚙ '+esc(evt.toolName)+'</span><span class="status">执行中...</span></div><div class="body"><pre>'+esc(evt.toolArgs)+'</pre></div>';
  $('chatWrap').appendChild(d);scrollBottom();return d;
}
function setToolDone(el,evt){if(!el)return;el.querySelector('.status').textContent='完成';el.querySelector('.body pre').textContent=evt.toolOut||'';}

/* toast */
function toast(msg){const d=document.createElement('div');d.className='t';d.textContent=msg;$('toast').appendChild(d);setTimeout(()=>d.remove(),3000);}

/* settings */
function openSettings(){
  const s=curSettings;
  $('sProv').innerHTML=['openai','claude','ollama','google'].map(p=>'<option'+(s.provider===p?' selected':'')+'>'+p+'</option>').join('');
  $('sModel').value=s.model||'';$('sKey').value=s.api_key||'';$('sBase').value=s.base_url||'';
  $('sTemp').value=s.temperature??0.7;$('sMaxTok').value=s.max_tokens||4096;$('sMaxIter').value=s.max_iterations||16;
  $('sSub').value=s.subagents!==false?'on':'off';$('sAuto').value=s.auto_allow?'on':'off';
  $('sMCP').value=JSON.stringify(s.mcp_servers||[],null,2);
  $('sProvs').value=JSON.stringify(s.providers||[],null,2);
  $('settingsModal').classList.add('on');
}
function closeSettings(){$('settingsModal').classList.remove('on');}
function saveSettings(){
  let mcp=[];try{mcp=JSON.parse($('sMCP').value||'[]')}catch(e){}
  let provs=[];try{provs=JSON.parse($('sProvs').value||'[]')}catch(e){}
  ws.send(JSON.stringify({type:'settings_set',settings:{
    provider:$('sProv').value,model:$('sModel').value,api_key:$('sKey').value,base_url:$('sBase').value,
    temperature:parseFloat($('sTemp').value)||0.7,max_tokens:parseInt($('sMaxTok').value)||4096,
    max_iterations:parseInt($('sMaxIter').value)||16,subagents:$('sSub').value==='on',
    auto_allow:$('sAuto').value==='on',streaming:true,
    mcp_servers:mcp,providers:provs
  }}));
  closeSettings();toast('设置已保存');
}

/* right panel */
function switchTab(tab,btn){
  $('tabInfo').style.display=tab==='info'?'':'none';
  $('tabFiles').style.display=tab==='files'?'':'none';
  document.querySelectorAll('.rtabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

/* file browser */
async function loadDir(){
  const p=$('fPath').value||'';
  try{
    const r=await fetch('/api/files?path='+encodeURIComponent(p));const d=await r.json();
    const tree=$('fTree');tree.innerHTML='';
    (d.entries||[]).forEach(e=>{
      const n=document.createElement('div');
      n.style.cssText='padding:4px 0;cursor:pointer;display:flex;gap:6px;border-radius:4px;padding:4px 6px';
      n.innerHTML='<span>'+(e.isDir?'📁':'📄')+'</span><span>'+esc(e.name)+'</span>';
      n.onmouseenter=()=>n.style.background='var(--primary-light)';
      n.onmouseleave=()=>n.style.background='';
      n.onclick=()=>{if(e.isDir){$('fPath').value=e.path;loadDir();}else{openEditor(e.path);}};
      tree.appendChild(n);
    });
  }catch(e){$('fTree').innerHTML='<div style="color:var(--red)">'+esc(e.message)+'</div>';}
}
async function openEditor(path){
  try{
    const r=await fetch('/api/file?path='+encodeURIComponent(path));const d=await r.json();
    $('editorFile').textContent=path;
    $('editorFile').title=path;
    $('editor').value=d.content;
    $('editor').dataset.path=path;
    $('editorWrap').style.display='';
    updateLineNums();
  }catch(e){toast(e.message);}
}
function closeEditor(){$('editorWrap').style.display='none';}
function updateLineNums(){
  const ta=$('editor'),ln=$('lineNums');
  if(!ta||!ln)return;
  const lines=ta.value.split('\n').length;
  ln.innerHTML=Array.from({length:lines},(_,i)=>'<div>'+(i+1)+'</div>').join('');
}
async function saveFile(){
  const path=$('editor').dataset.path;
  if(!path)return;
  try{
    await fetch('/api/file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,content:$('editor').value})});
    toast('已保存 '+path);
  }catch(e){toast(e.message);}
}
$('editor').addEventListener('input',updateLineNums);
$('editor').addEventListener('scroll',()=>{$('lineNums').scrollTop=$('editor').scrollTop;});
$('editor').addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();const s=e.target.selectionStart,v=e.target.value;e.target.value=v.slice(0,s)+'  '+v.slice(e.target.selectionEnd);e.target.selectionStart=e.target.selectionEnd=s+2;updateLineNums();}
  if(e.key==='s'&&(e.ctrlKey||e.metaKey)){e.preventDefault();saveFile();}
});

/* ask */
function replyAsk(ok,always){
  if(!curAsk)return;
  ws.send(JSON.stringify({type:'ask_reply',askId:curAsk,askApprove:ok,askAlways:!!always}));
  $('askBar').style.display='none';curAsk=null;busy=false;
}

/* input */
const input=$('input');
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px';});

function send(){
  const text=input.value.trim();
  if(!text||busy||!ws||ws.readyState!==WebSocket.OPEN)return;
  if(text==='/clear'){$('chatWrap').innerHTML='';renderEmpty();ws.send(JSON.stringify({type:'message',content:'/clear'}));input.value='';return;}
  addMsg('user',text);input.value='';input.style.height='auto';
  busy=true;$('send').disabled=true;
  ws.send(JSON.stringify({type:'message',content:text}));
}

/* connection */
function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(proto+'://'+location.host+'/ws');
  ws.onopen=()=>{
    ws.send(JSON.stringify({type:'sessions_get'}));
    ws.send(JSON.stringify({type:'settings_get'}));
    $('connStat').innerHTML='<span style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block"></span> 已连接';
  };
  ws.onclose=()=>{
    busy=false;$('send').disabled=true;
    $('connStat').innerHTML='<span style="width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block"></span> 断开';
    setTimeout(connect,2000);
  };
  ws.onmessage=e=>{
    let evt;try{evt=JSON.parse(e.data)}catch{return;}
    switch(evt.type){
      case 'delta':
        if(busy&&!lastAsst){lastAsst=addMsg('assistant','');}
        if(lastAsst)appendTo(lastAsst,evt.content);
        $('statusBar').textContent='思考中...';
        break;
      case 'tool_start':tools.push(addTool(evt));break;
      case 'tool_done':if(tools.length){setToolDone(tools.pop(),evt);}break;
      case 'status':$('statusBar').textContent=evt.content||'';break;
      case 'settings':curSettings=evt.settings||{};$('modelTag').textContent=curSettings.model||'';break;
      case 'sessions':
        sessions=evt.sessions||[];const newSid=evt.sessionId||'';
        if(newSid&&newSid!==curSess){$('chatWrap').innerHTML='';renderEmpty();}
        curSess=newSid;prevSess=curSess;renderSessions();break;
      case 'stats':
        $('sMsgs').textContent=(evt.stats&&evt.stats.messages)||0;
        $('sTokens').textContent=(evt.stats&&evt.stats.tokens)||0;
        $('sAlways').textContent=((evt.stats&&evt.stats.always_allow)||[]).join(', ')||'-';
        break;
      case 'ask':curAsk=evt.askId;$('askName').textContent=evt.toolName;$('askBar').style.display='';busy=true;break;
      case 'done':
        busy=false;lastAsst=null;tools=[];$('statusBar').textContent='';
        $('send').disabled=false;
        ws.send(JSON.stringify({type:'sessions_get'}));
        break;
      case 'error':
        addMsg('assistant','⚠ '+evt.error);busy=false;lastAsst=null;$('send').disabled=false;
        $('statusBar').textContent='';
        break;
      case 'interrupt':
        busy=false;lastAsst=null;tools=[];$('send').disabled=false;
        $('statusBar').textContent='';
        break;
    }
  };
}

/* version */
fetch('/api/version').then(r=>r.json()).then(d=>{$('sVer').textContent=d.version||''}).catch(()=>{});

connect();
</script>

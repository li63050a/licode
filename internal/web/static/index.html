<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>licode</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #21262d;
    --fg: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --purple: #bc8cff;
    --yellow: #d29922;
    --red: #f85149;
    --input: #0d1117;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", monospace;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  header .logo { font-weight: 700; color: var(--accent); letter-spacing: .5px; }
  header .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
    display: inline-block; margin-right: 4px;
  }
  header .dot.online { background: var(--green); }
  header .dot.offline { background: var(--red); }
  header .spacer { flex: 1; }
  header .meta { color: var(--muted); }
  .btn {
    border: 1px solid var(--border); background: var(--input); color: var(--fg);
    border-radius: 8px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  #chat { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin: 0 auto 14px; max-width: 900px; }
  .msg .role {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin-bottom: 4px;
  }
  .msg.user .role { color: var(--accent); }
  .msg.assistant .role { color: var(--green); }
  .msg .body { white-space: pre-wrap; word-break: break-word; }
  .msg.user .body {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px;
  }
  .msg.assistant .body { padding: 2px 0; }
  .msg.error .body { color: var(--red); }
  .tool { margin: 6px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .tool .head {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: var(--panel); cursor: pointer; font-size: 13px;
  }
  .tool .head .name { color: var(--purple); font-weight: 600; }
  .tool .head .status { color: var(--yellow); }
  .tool .head .status.done { color: var(--green); }
  .tool .head .chev { margin-left: auto; color: var(--muted); }
  .tool .detail { display: none; padding: 8px 12px; border-top: 1px solid var(--border); }
  .tool.open .detail { display: block; }
  .tool .detail pre {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font-size: 12.5px; color: var(--muted);
  }
  .tool .detail .args { color: var(--yellow); }
  .cursor { display: inline-block; width: 8px; background: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #askbar {
    display: none; padding: 10px 16px; background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #askbar .toolname { color: var(--purple); font-weight: 600; }
  #composer {
    border-top: 1px solid var(--border); background: var(--panel);
    padding: 10px 16px 14px;
  }
  #composer .row { display: flex; gap: 8px; max-width: 900px; margin: 0 auto; }
  textarea {
    flex: 1; resize: none; height: 46px; max-height: 160px;
    background: var(--input); color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button#send {
    border: 1px solid var(--border); background: var(--input); color: var(--fg);
    border-radius: 8px; padding: 0 18px; font: inherit; cursor: pointer;
  }
  button#send:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button#send:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 6px; }
  /* 设置弹窗 */
  #settings {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 10; align-items: center; justify-content: center;
  }
  #settings .panel {
    width: min(560px, 92vw); max-height: 86vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 22px;
  }
  #settings h3 { margin: 0 0 14px; color: var(--accent); }
  #settings .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  #settings label { width: 130px; color: var(--muted); font-size: 13px; flex-shrink: 0; }
  #settings input, #settings select {
    flex: 1; background: var(--input); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 9px; font: inherit; font-size: 13.5px;
  }
  #settings input:focus, #settings select:focus, #settings textarea:focus { border-color: var(--accent); outline: none; }
  #settings textarea {
    flex: 1; background: var(--input); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 9px; font: 12px/1.4 ui-monospace, monospace; resize: vertical;
  }
  #settings .btns { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
  #settings .btn.primary { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<header>
  <span class="logo">licode</span>
  <span><span class="dot" id="dot"></span><span id="conn">disconnected</span></span>
  <span class="spacer"></span>
  <span class="meta" id="meta"></span>
  <button class="btn" id="settingsBtn">设置</button>
</header>
<div id="chat"></div>
<div id="askbar">
  是否允许执行工具 <span class="toolname" id="askTool">…</span>？
  <button class="btn" id="askNo" style="margin-left:12px">拒绝</button>
  <button class="btn primary" id="askYes">允许</button>
</div>
<div id="composer">
  <div class="row">
    <textarea id="input" placeholder="问点什么…  /clear 清空会话，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send" disabled>发送</button>
  </div>
  <div class="hint">licode — Enter 发送 · Shift+Enter 换行 · /clear 清空 · 设置按钮可修改提供商/模型/密钥</div>
</div>

<div id="settings">
  <div class="panel">
    <h3>设置</h3>
    <div class="row"><label>提供商</label>
      <select id="st_provider">
        <option>openai</option><option>claude</option><option>ollama</option><option>gemini</option>
      </select>
    </div>
    <div class="row"><label>模型</label><input id="st_model"></div>
    <div class="row"><label>API 地址</label><input id="st_base_url"></div>
    <div class="row"><label>API 密钥</label><input id="st_api_key" type="password"></div>
    <div class="row"><label>温度</label><input id="st_temperature"></div>
    <div class="row"><label>最大输出 tokens</label><input id="st_max_tokens"></div>
    <div class="row"><label>最大迭代次数</label><input id="st_max_iterations"></div>
    <div class="row"><label>子代理</label>
      <select id="st_subagents"><option>开启</option><option>关闭</option></select>
    </div>
    <div class="row"><label>上下文压缩</label>
      <select id="st_compaction"><option>开启</option><option>关闭</option></select>
    </div>
    <div class="row"><label>自动标题</label>
      <select id="st_titlegen"><option>开启</option><option>关闭</option></select>
    </div>
    <div class="row"><label>需确认工具</label><input id="st_ask_tools" placeholder="逗号分隔"></div>
    <div class="row"><label>禁用工具</label><input id="st_deny_tools" placeholder="逗号分隔"></div>
    <div class="row"><label>MCP 服务器</label><textarea id="st_mcp" rows="3" placeholder='[{"name":"fs","command":"npx","args":["-y","@modelcontextprotocol/server-filesystem","."]}]'></textarea></div>
    <div class="btns">
      <button class="btn" id="settingsCancel">取消</button>
      <button class="btn primary" id="settingsSave">保存</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('input'), sendBtn = $('send');
let ws = null, busy = false, firstConnect = true, curAsk = null;
let stDirty = false;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function autoScroll() { chat.scrollTop = chat.scrollHeight; }
function setConn(online) {
  $('dot').className = 'dot ' + (online ? 'online' : 'offline');
  $('conn').textContent = online ? 'connected' : 'disconnected';
  sendBtn.disabled = !online;
}
function addMsg(role, text, isError) {
  const m = el('div', 'msg ' + role + (isError ? ' error' : ''));
  m.appendChild(el('div', 'role', role === 'user' ? 'you' : role === 'assistant' ? 'licode' : role));
  const body = el('div', 'body');
  if (text !== undefined) body.textContent = text;
  m.appendChild(body);
  chat.appendChild(m);
  autoScroll();
  return m;
}
function appendTo(m, text) {
  const body = m.querySelector('.body');
  body.textContent += text;
  autoScroll();
}
function addTool(evt) {
  const t = el('div', 'tool');
  const head = el('div', 'head');
  head.appendChild(el('span', 'name', '⚙ ' + evt.toolName));
  const status = el('span', 'status', '运行中…');
  head.appendChild(status);
  head.appendChild(el('span', 'chev', '▸'));
  const detail = el('div', 'detail');
  detail.appendChild(el('pre', 'args', evt.toolArgs || ''));
  detail.appendChild(el('pre', 'out', ''));
  t.appendChild(head); t.appendChild(detail);
  head.addEventListener('click', () => {
    t.classList.toggle('open');
    head.querySelector('.chev').textContent = t.classList.contains('open') ? '▾' : '▸';
  });
  chat.appendChild(t);
  autoScroll();
  return { root: t, status, out: detail.querySelector('pre.out') };
}
function setToolDone(tool, evt) {
  tool.status.className = 'status done';
  tool.status.textContent = '✓ done';
  tool.out.textContent = (evt.toolOut || '').slice(0, 4000);
}
function showAsk(evt) {
  curAsk = evt.askId;
  $('askTool').textContent = evt.toolName;
  $('askbar').style.display = 'block';
  busy = true;
}
function hideAsk() { $('askbar').style.display = 'none'; curAsk = null; }
function replyAsk(ok) {
  if (!curAsk) return;
  ws.send(JSON.stringify({ type: 'ask_reply', askId: curAsk, askApprove: ok }));
  hideAsk(); busy = false;
}
$('askYes').addEventListener('click', () => replyAsk(true));
$('askNo').addEventListener('click', () => replyAsk(false));

// 设置弹窗
function openSettings() {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'settings_get' }));
  $('settings').style.display = 'flex';
}
function fillSettings(s) {
  $('st_provider').value = s.provider || 'openai';
  $('st_model').value = s.model || '';
  $('st_base_url').value = s.base_url || '';
  $('st_api_key').value = s.api_key || '';
  $('st_temperature').value = s.temperature != null ? s.temperature : 0.7;
  $('st_max_tokens').value = s.max_tokens || 4096;
  $('st_max_iterations').value = s.max_iterations || 16;
  $('st_subagents').value = s.subagents ? '开启' : '关闭';
  $('st_compaction').value = s.compaction ? '开启' : '关闭';
  $('st_titlegen').value = s.title_gen ? '开启' : '关闭';
  $('st_ask_tools').value = (s.ask_tools || []).join(', ');
  $('st_deny_tools').value = (s.deny_tools || []).join(', ');
  $('st_mcp').value = JSON.stringify(s.mcp_servers || [], null, 1);
}
function readSettings() {
  let mcp = [];
  try { mcp = JSON.parse($('st_mcp').value || '[]'); } catch (e) {}
  return {
    provider: $('st_provider').value,
    model: $('st_model').value,
    base_url: $('st_base_url').value,
    api_key: $('st_api_key').value,
    temperature: parseFloat($('st_temperature').value) || 0.7,
    max_tokens: parseInt($('st_max_tokens').value) || 4096,
    max_iterations: parseInt($('st_max_iterations').value) || 16,
    subagents: $('st_subagents').value === '开启',
    compaction: $('st_compaction').value === '开启',
    title_gen: $('st_titlegen').value === '开启',
    ask_tools: $('st_ask_tools').value.split(/[,，\s]+/).filter(Boolean),
    deny_tools: $('st_deny_tools').value.split(/[,，\s]+/).filter(Boolean),
    mcp_servers: mcp,
  };
}
$('settingsBtn').addEventListener('click', openSettings);
$('settingsCancel').addEventListener('click', () => $('settings').style.display = 'none');
$('settingsSave').addEventListener('click', () => {
  const s = readSettings();
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'settings_set', settings: s }));
  $('settings').style.display = 'none';
});

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');
  ws.onopen = () => { setConn(true); firstConnect = false; document.title = 'licode'; };
  ws.onclose = () => {
    setConn(false);
    document.title = '● licode (disconnected)';
    setTimeout(connect, 2000);
  };
  ws.onmessage = e => {
    let evt;
    try { evt = JSON.parse(e.data); } catch { return; }
    switch (evt.type) {
      case 'delta': {
        if (busy && !lastAssistant) lastAssistant = addMsg('assistant');
        if (lastAssistant) appendTo(lastAssistant, evt.content);
        break;
      }
      case 'tool_start': tools.push(addTool(evt)); break;
      case 'tool_done':
        if (tools.length) setToolDone(tools.pop(), evt);
        break;
      case 'status': $('meta').textContent = evt.content || ''; break;
      case 'settings':
        if ($('settings').style.display === 'flex') fillSettings(evt.settings || {});
        break;
      case 'ask': showAsk(evt); break;
      case 'done':
        busy = false; lastAssistant = null; tools = [];
        $('meta').textContent = '';
        sendBtn.disabled = !(ws && ws.readyState === WebSocket.OPEN);
        break;
      case 'error':
        addMsg('assistant', '⚠ ' + evt.error, true);
        busy = false; lastAssistant = null;
        sendBtn.disabled = !(ws && ws.readyState === WebSocket.OPEN);
        break;
    }
  };
}
let lastAssistant = null, tools = [];

function send() {
  const text = input.value.trim();
  if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
  if (text === '/clear') { chat.innerHTML = ''; input.value = ''; ws.send(JSON.stringify({ type: 'message', content: '/clear' })); return; }
  addMsg('user', text);
  input.value = '';
  busy = true;
  sendBtn.disabled = true;
  ws.send(JSON.stringify({ type: 'message', content: text }));
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  if (e.key === 'Escape') { input.value = ''; }
});
sendBtn.addEventListener('click', send);
connect();
</script>
</body>
</html>

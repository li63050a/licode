<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · licode</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f6f8fc;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1f36;
            --text-secondary: #6b7a93;
            --text-placeholder: #9aa6b9;
            --accent: #4f6ef7;
            --accent-hover: #3a56d4;
            --accent-soft: rgba(79, 110, 247, 0.10);
            --shadow: 0 8px 32px rgba(0, 20, 60, 0.08);
            --radius: 16px;
            --transition: 0.2s ease;
        }

        [data-theme="dark"] {
            --bg: #0d111f;
            --card-bg: rgba(20, 28, 52, 0.78);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-primary: #edf2f9;
            --text-secondary: #8e9bb5;
            --text-placeholder: #5d6b89;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            --accent-soft: rgba(79, 110, 247, 0.18);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            padding: 20px;
            transition: background var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: -40%;
            z-index: -1;
            background:
                radial-gradient(30% 30% at 20% 30%, rgba(79, 110, 247, 0.20), transparent 70%),
                radial-gradient(25% 25% at 85% 70%, rgba(0, 200, 255, 0.15), transparent 70%);
            transition: opacity 0.4s;
            pointer-events: none;
        }
        [data-theme="dark"] body::before {
            background:
                radial-gradient(30% 30% at 20% 30%, rgba(79, 110, 247, 0.28), transparent 70%),
                radial-gradient(25% 25% at 85% 70%, rgba(0, 200, 255, 0.18), transparent 70%);
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 36px 32px 32px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px) saturate(1.6);
            -webkit-backdrop-filter: blur(18px) saturate(1.6);
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }

        .brand {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--accent);
            margin-bottom: 2px;
            line-height: 1.2;
        }
        .subhead {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            color: var(--text-primary);
            outline: none;
            transition: border var(--transition), box-shadow var(--transition), background var(--transition);
        }
        [data-theme="dark"] .form-group input {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
        }
        .form-group input::placeholder {
            color: var(--text-placeholder);
        }
        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
            background: rgba(255, 255, 255, 0.7);
        }
        [data-theme="dark"] .form-group input:focus {
            background: rgba(255, 255, 255, 0.08);
        }

        .error-msg {
            display: none;
            color: #e5484d;
            font-size: 13px;
            background: rgba(229, 72, 77, 0.06);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            border-left: 3px solid #e5484d;
        }
        .error-msg.visible {
            display: block;
        }

        .btn-login {
            width: 100%;
            padding: 11px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            transition: background var(--transition), transform 0.1s, box-shadow var(--transition);
            box-shadow: 0 4px 14px rgba(79, 110, 247, 0.30);
            margin-top: 4px;
        }
        .btn-login:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 20px rgba(79, 110, 247, 0.35);
        }
        .btn-login:active {
            transform: scale(0.98);
        }

        /* 工具栏：只保留主题切换 */
        .toolbar {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .toolbar button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            backdrop-filter: blur(12px) saturate(1.4);
            -webkit-backdrop-filter: blur(12px) saturate(1.4);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: border var(--transition), color var(--transition), background var(--transition);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 0;
            font-family: inherit;
        }
        .toolbar button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px 24px;
            }
            .brand {
                font-size: 22px;
            }
            .toolbar {
                top: 12px;
                right: 12px;
                gap: 6px;
            }
            .toolbar button {
                width: 32px;
                height: 32px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- 工具栏：只剩主题切换按钮 -->
    <div class="toolbar">
        <button id="themeToggle" title="切换主题" aria-label="切换主题">
            <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
        </button>
    </div>

    <div class="login-card">
        <div class="brand">licode</div>
        <div class="subhead">AI 编程助手 · 请登录</div>

        <div class="error-msg" id="errorMsg">用户名或密码错误</div>

        <form method="post" action="/login" id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input
                type="text"
                id="username"
                name="username"
                placeholder="请输入用户名"
                autocomplete="username"
                required
                />
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input
                type="password"
                id="password"
                name="password"
                placeholder="请输入密码"
                autocomplete="current-password"
                required
                />
            </div>
            <button type="submit" class="btn-login">登录</button>
        </form>
    </div>

    <script>
        // ===== 主题切换（仅保留暗色/亮色） =====
        function getTheme() {
            return localStorage.getItem('licode_theme') || 'light';
        }

        function applyTheme() {
            const theme = getTheme();
            document.documentElement.setAttribute('data-theme', theme);

            const icon = document.getElementById('themeIcon');
            if (!icon) return;

            if (theme === 'dark') {
                icon.outerHTML = `
              <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
              </svg>
            `;
            } else {
                icon.outerHTML = `
              <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            `;
            }
        }

        function checkError() {
            const params = new URLSearchParams(location.search);
            const errEl = document.getElementById('errorMsg');
            if (params.has('error') && errEl) {
                errEl.classList.add('visible');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const themeBtn = document.getElementById('themeToggle');
            if (themeBtn) {
                themeBtn.addEventListener('click', function() {
                    const cur = document.documentElement.getAttribute('data-theme');
                    const next = cur === 'dark' ? 'light' : 'dark';
                    localStorage.setItem('licode_theme', next);
                    applyTheme();
                });
            }

            applyTheme();
            checkError();
        });
    </script>
</body>
</html>

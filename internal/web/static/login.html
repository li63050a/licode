<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · licode</title>
<style>
:root{--primary:#4D6BFE;--bg:#F7F8FA;--bg-card:#FFF;--fg:#1F2329;--fg2:#4E5969;--border:#E5E6EB;--shadow:0 4px 24px rgba(0,0,0,.08)}
[data-theme="dark"]{--primary:#5B7BFF;--bg:#17181A;--bg-card:#1F2023;--fg:#F2F3F5;--fg2:#C9CDD4;--border:#2E3033;--shadow:0 4px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--fg)}
.card{width:360px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:36px 32px;box-shadow:var(--shadow)}
.logo{text-align:center;margin-bottom:28px;font-size:22px;font-weight:700;color:var(--primary)}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:12px;color:var(--fg2);margin-bottom:4px;font-weight:500}
.fg input{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;outline:none;background:var(--bg);color:var(--fg)}
.fg input:focus{border-color:var(--primary)}
.btn{width:100%;padding:10px;border:none;border-radius:8px;background:var(--primary);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{opacity:.9}
.error{color:#C62828;font-size:13px;text-align:center;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">licode</div>
  <div class="error" id="err">用户名或密码错误</div>
  <form method="POST" action="/login">
    <div class="fg"><label>用户名</label><input name="username" autofocus required /></div>
    <div class="fg"><label>密码</label><input name="password" type="password" required /></div>
    <button class="btn" type="submit">登录</button>
  </form>
</div>
<script>
if(new URLSearchParams(location.search).has('error'))document.getElementById('err').style.display='block';
</script>
</body>
</html>

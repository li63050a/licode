<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>licode {{.Version}}</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<div class="app">
  <!-- sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="top">
      <button class="btn p" onclick="newSession()">+ 新对话</button>
    </div>
    <div class="slist" id="slist"></div>
    <div class="foot">
      <div id="connStat" style="display:flex;align-items:center;gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block"></span> 已连接</div>
    </div>
  </div>

  <!-- main -->
  <div class="main">
    <header>
      <button class="ib" onclick="toggle('sidebar')" title="侧边栏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="logo">licode</div>
      <span id="modelTag" style="font-size:11px;color:var(--muted)"></span>
      <div class="spacer"></div>
      <button class="ib" onclick="openSettings()" title="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
      </button>
      <button class="ib" onclick="toggle('right')" title="信息">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      </button>
      <button class="ib" id="themeBtn" onclick="toggleTheme()" title="主题">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </header>

    <div id="chat"><div class="wrap" id="chatWrap"><div class="empty"><div class="title">licode</div><div>有什么可以帮你的？</div></div></div></div>

    <!-- ask bar -->
    <div id="askBar">
      <div class="wrap">
        <div class="info">工具 <b id="askName"></b> 请求执行</div>
        <button class="btn" onclick="replyAsk(false)">拒绝</button>
        <button class="btn p" onclick="replyAsk(true)">允许</button>
        <button class="btn" onclick="replyAsk(true,true)" style="font-size:12px">始终允许</button>
      </div>
    </div>

    <!-- input -->
    <div id="inputBar">
      <div class="wrap">
        <textarea id="input" rows="1" placeholder="输入消息..."></textarea>
        <button id="stop" onclick="stopGen()" style="display:none" title="停止生成">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        </button>
        <button class="ib" onclick="newBranch()" title="把当前对话复制为一个新分支对话（完整上下文）">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v18M6 7h6a4 4 0 0 1 0 8h-1M6 15h6a4 4 0 0 1 0 8h-1"/></svg>
        </button>
        <button id="send" onclick="send()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
      </div>
    </div>
    <div class="status" id="statusBar"></div>
  </div>

  <!-- right panel -->
  <div class="right collapsed" id="right">
    <div class="rtabs">
      <button class="active" onclick="switchTab('info',this)">信息</button>
      <button onclick="switchTab('files',this)">文件</button>
      <button onclick="switchTab('audit',this)">审计</button>
    </div>
    <div class="rpanel" id="tabInfo">
      <h4>会话</h4>
      <div class="row"><span>消息数</span><span id="sMsgs">0</span></div>
      <div class="row"><span>Token 估算</span><span id="sTokens">0</span></div>
      <div class="row"><span>始终允许</span><span id="sAlways">-</span></div>
      <h4>版本</h4>
      <div class="row"><span>licode</span><span id="sVer">-</span></div>
      <h4>备份</h4>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button class="btn" style="flex:1" onclick="exportBackup()">导出</button>
        <button class="btn" style="flex:1" onclick="document.getElementById('impFile').click()">导入</button>
        <input type="file" id="impFile" accept=".zip" style="display:none" onchange="importBackup(this.files[0])" />
      </div>
      <h4>联系与交流</h4>
      <div class="row"><span>GitHub</span><a href="https://github.com/li63050a/licode" target="_blank" style="color:var(--primary);text-decoration:none">li63050a/licode</a></div>
      <div class="row"><span>Gitee</span><a href="https://gitee.com/li63050a/licode" target="_blank" style="color:var(--primary);text-decoration:none">li63050a/licode</a></div>
      <div class="row"><span>B 站</span><a href="https://b23.tv/nDqj0DT" target="_blank" style="color:var(--primary);text-decoration:none">小帅5656</a></div>
      <div class="row"><span>QQ 群</span><a href="https://qun.qq.com/universal-share/share?ac=1&authKey=zq9BYcTtBQm6GbvWiEWiBvDWNWbqhw2%2F%2BRnGM21c0jcL%2FofGqBFeXLr%2BtYT3SkO6&busi_data=eyJncm91cENvZGUiOiIxMDI2OTM5NzQxIiwidG9rZW4iOiJxNkNWUTUxYXVxSmRHZXRvdWtkZnhaN25INzJrMmNaNFpVTjJ5ZTVLYmRvWTFuOEZTd093UXBtQi8vQWk2T1JyIiwidWluIjoiMzYzNTczNjE4MCJ9&data=073ZrPEFZXFvoEDWatbWTidAitiN4OIbiaVDWoR7hVIwJurEPC7Swm6OREVpn6omzobXLn3SRErNKxKbYDTZQA&svctype=4&tempid=h5_group_info" target="_blank" style="color:var(--primary);text-decoration:none">1026939741</a></div>
    </div>
    <div class="rpanel" id="tabFiles" style="display:none;padding:0">
      <div style="padding:12px 12px 8px">
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <input id="fPath" style="flex:1" placeholder="路径" />
          <button class="btn" onclick="loadDir()">浏览</button>
        </div>
        <div id="fTree" style="font-size:13px"></div>
      </div>
      <!-- code editor -->
      <div id="editorWrap" style="display:none;border-top:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg-panel)">
          <span id="editorFile" style="flex:1;font-size:12px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg2)"></span>
          <button class="btn" style="padding:4px 10px;font-size:11px" onclick="saveFile()">保存</button>
          <button class="ib" style="padding:4px" onclick="closeEditor()">✕</button>
        </div>
        <div style="display:flex;overflow:hidden;max-height:50vh">
          <div id="lineNums" style="padding:8px 0;text-align:right;color:var(--muted);font:12px/1.5 var(--mono);min-width:36px;user-select:none;overflow:hidden;background:var(--bg-panel);border-right:1px solid var(--border)"></div>
          <textarea id="editor" style="flex:1;padding:8px 12px;border:none;outline:none;resize:none;font:12px/1.5 var(--mono);background:var(--bg-card);color:var(--fg);tab-size:2;overflow:auto;min-height:200px"></textarea>
        </div>
      </div>
    </div>
    <div class="rpanel" id="tabAudit" style="display:none;padding:0"></div>
  </div>
</div>

<!-- settings modal（内容由 /fragment/settings 通过 HTMX 填充） -->
<div class="modal" id="settingsModal"></div>

<div id="toast"></div>

<!-- 代码审计：修复预览（二次确认） -->
<div class="modal" id="diffModal">
  <div class="box" style="width:860px;max-width:96vw">
    <div class="hd">修复预览 <span id="diffFileList" style="font-size:12px;color:var(--muted);font-weight:400"></span>
      <button class="ib" onclick="closeDiff()">✕</button></div>
    <div class="bd" style="padding:0;max-height:62vh;overflow:auto" id="diffBody"></div>
    <div class="bd" id="diffNote" style="padding:8px 20px;font-size:12px;color:var(--muted);display:none">
      确认后将对文件生成 <code>.bak</code> 备份，再写入修复内容。
    </div>
    <div class="ft">
      <button class="btn" onclick="closeDiff()">取消</button>
      <button class="btn p" onclick="confirmFix()">确认修复</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
